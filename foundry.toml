[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 10_000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
ffi = false

[profile.ci]
fuzz.runs = 1_000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
